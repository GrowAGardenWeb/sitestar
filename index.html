<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller V5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  color-scheme: dark;
  --bg:#0c0e11; --panel:#14171c; --panel2:#1b1f26; --line:#2a2f38; --ink:#e8eaee; --dim:#9aa1ad; --faint:#6b7280;

  --f-disp:"Chakra Petch","Arial Narrow",system-ui,sans-serif;

  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 24px}
.wrap{max-width:1500px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
header h1{font-family:var(--f-disp);font-size:22px;letter-spacing:.05em;text-transform:uppercase;margin:0}
header h1 b{color:var(--yel)}
.sub{font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
.mode{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-left:auto}
.mode button{font-family:var(--f-disp);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:8px 16px;background:var(--panel);color:var(--dim);border:0;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--yel);color:#111}
.btn{font-family:var(--f-disp);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#4a5260}
.btn[aria-pressed="true"]{border-color:var(--yel);color:var(--yel)}
.btn.primary{background:var(--yel);color:#111;border-color:var(--yel)}
.btn.danger{color:#ffb3b3;border-color:#5a2a2e}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr) 310px;gap:12px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:230px minmax(0,1fr)}.right{grid-column:1/-1;display:grid!important;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}

.pan{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.pan h4{font-family:var(--f-disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px;color:var(--dim)}
.cat{max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:8px}
.grp{margin-bottom:10px}
.grp h5{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
.pb{display:flex;justify-content:space-between;gap:6px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:5px 8px;border-radius:4px;margin-bottom:3px;cursor:pointer;font-size:13px;font-family:var(--f-body)}
.pb:hover{border-color:var(--yel)}
.pb small{font-family:var(--f-mono);font-size:10px;color:var(--faint);white-space:nowrap}
.view{position:relative;background:#07080a;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:min(76vh,780px);min-height:380px}
#cv{display:block;width:100%;height:100%;touch-action:none}
.toolbar{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.toolbar>*{pointer-events:auto}
.toolbar select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px;font-size:12px}
.toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:rgba(12,14,17,.92);border:1px solid var(--yel);color:var(--yel);font-size:12px;padding:5px 10px;border-radius:4px;pointer-events:none}
.btn:disabled{opacity:.4;cursor:default}
.hud{position:absolute;left:8px;bottom:8px;background:rgba(12,14,17,.85);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:12px;color:var(--dim);max-width:calc(100% - 16px)}
.hud kbd{font-family:var(--f-mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--ink)}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:11px;font-weight:700;background:rgba(10,12,14,.88);color:var(--yel);border:1px solid rgba(245,197,24,.5);padding:1px 6px;border-radius:3px;pointer-events:none;white-space:nowrap}
.lbl.w{color:#fff;border-color:#666}
.right{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.fld{display:grid;grid-template-columns:78px 1fr;gap:6px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--dim)}
.fld select,.fld input{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:12px;font-family:var(--f-body)}
.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.xyz input{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px;font-family:var(--f-mono);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.bad{border-color:var(--bad);color:var(--bad)}
.mech{border:1px solid var(--line);border-radius:5px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.mech summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:6px;list-style:none}
.mech summary::-webkit-details-marker{display:none}
.mech summary span.t{font-family:var(--f-mono);font-size:10px;color:var(--faint);text-transform:uppercase}
.slider{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;margin-bottom:8px;font-size:12px}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--yel)}
.keybtn{font-family:var(--f-mono);font-size:11px;background:#0f1216;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:3px 6px;cursor:pointer;min-width:44px}
.keybtn.wait{border-color:var(--yel);color:var(--yel)}
textarea{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;font-family:var(--f-mono);font-size:11px;padding:6px}
.note{font-size:12px;color:var(--faint)}
#padView{position:fixed;inset:0;z-index:60;background:#15171a;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
#pvRot{position:absolute;top:0;left:0;display:flex;flex-direction:column;padding:10px 18px;box-sizing:border-box;transform-origin:top left;
  background:radial-gradient(120% 90% at 50% 45%,#3d4046 0%,#2b2d31 55%,#151618 100%)}
#padView[hidden]{display:none!important}
#padView,#padView *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#padView input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.pv-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px}
.pv-code{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.pv-code input{font-family:var(--f-mono);font-size:40px;letter-spacing:.3em;width:220px;text-align:center;background:#0b0d10;color:var(--yel);border:2px solid var(--line);border-radius:8px;padding:6px}
.pv-pad{flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;min-height:0}
.pv-side{display:grid!important;grid-template-columns:auto auto;grid-template-rows:auto auto;align-items:center;justify-items:center;gap:6px 14px}
.pv-side .pv-bump{grid-column:1/-1}
.pv-pad>.pv-side:first-child .pv-stick{grid-column:1;grid-row:2}.pv-pad>.pv-side:first-child .pv-dpad{grid-column:2;grid-row:2;align-self:end}
.pv-pad>.pv-side:last-child .pv-stick{grid-column:2;grid-row:2}.pv-pad>.pv-side:last-child .pv-dpad{grid-column:1;grid-row:2;align-self:end}
.pv-pad>.pv-side:first-child .pv-bump{justify-self:start}.pv-pad>.pv-side:last-child .pv-bump{justify-self:end}
.pv-pad[hidden]{display:none!important}
.pv-side{display:flex;flex-direction:column;align-items:center;gap:12px}
.pv-bump{display:flex;gap:8px}
.pv-bump button{font-family:var(--f-disp);font-weight:700;font-size:16px;width:70px;height:40px;border-radius:12px 12px 5px 5px;background:#2b2d31;color:#e0263a;border:1px solid #000;touch-action:none}
.pv-stick{width:min(40vmin,190px);height:min(40vmin,190px);border-radius:50%;background:radial-gradient(#2a2c30,#0b0c0e);border:4px solid #000;position:relative;touch-action:none}
.pv-stick i{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:radial-gradient(#55595f,#26282c);box-shadow:0 3px 6px rgba(0,0,0,.6)}
.pv-dpad{position:relative;width:130px;height:110px}
.pv-dpad button{position:absolute;width:44px;height:44px;border-radius:50%;background:#0f1012;border:1px solid #000;color:#e0263a;font-weight:700;font-size:16px;touch-action:none;padding:0}
.pv-dpad .u{left:43px;top:0}.pv-dpad .d{left:43px;bottom:0}.pv-dpad .l{left:0;top:33px}.pv-dpad .r{right:0;top:33px}
#padView button.on{background:#e0263a;color:#fff}
.pv-mid{text-align:center;max-width:140px}.pv-logo{font-family:var(--f-disp);font-weight:700;color:#e0263a;font-size:26px;letter-spacing:.12em}

.matchHud{position:absolute;right:8px;top:8px;display:grid;grid-template-columns:auto auto auto;align-items:stretch;background:rgba(12,14,17,.92);border:1px solid var(--line);border-radius:6px;overflow:hidden;z-index:4;pointer-events:none}
.matchHud .sc{font-family:var(--f-mono);font-weight:700;font-size:26px;padding:4px 14px;min-width:70px;text-align:center}
.matchHud .r{color:#ff6b79;border-left:5px solid var(--red)}.matchHud .b{color:#5cb4ff;border-right:5px solid var(--blue)}
.matchHud .mid{padding:4px 14px;text-align:center;background:#1b1f26}.matchHud .clk{font-family:var(--f-mono);font-size:22px;font-weight:700;line-height:1.1}.matchHud .ph{font-family:var(--f-disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--yel)}
.gcard{position:absolute;right:8px;bottom:8px;width:min(370px,calc(100% - 16px));max-height:calc(100% - 70px);overflow:auto;background:rgba(18,20,24,.97);border:1px solid var(--yel);border-radius:8px;padding:10px 12px;z-index:5;font-size:13px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px}.gh b{font-family:var(--f-head,inherit);color:var(--yel)}.gh .btn{padding:2px 8px}
.glist{display:flex;flex-direction:column;gap:6px}.gitem{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit}
.gitem:hover{border-color:var(--yel)}.gitem span{font-size:12px;color:var(--dim)}
.gdots{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.gdots button{width:14px;height:6px;border-radius:3px;border:0;background:#3a3f47;cursor:pointer;padding:0}.gdots button.done{background:#8a7420}.gdots button.on{background:var(--yel)}
.gstep{font-family:var(--f-mono);font-size:11px;color:var(--faint);text-transform:uppercase}.gtitle{font-size:16px;font-weight:700;margin:2px 0 6px}.gdesc{color:var(--ink);line-height:1.45}
.gsub{font-family:var(--f-mono);font-size:11px;color:var(--yel);text-transform:uppercase;margin:10px 0 4px}.gbom{display:grid;gap:2px;font-size:12px;color:var(--dim)}.gbom b{color:var(--ink);font-family:var(--f-mono)}
.gsteps{margin:8px 0 0 18px;padding:0;font-size:12px}.gsteps button{background:none;border:0;color:var(--ink);cursor:pointer;text-align:left;padding:2px 0;font:inherit}.gsteps button:hover{color:var(--yel)}
.btn.pri{border-color:var(--yel);color:var(--yel)}
.rwarn{position:absolute;left:50%;top:90px;transform:translateX(-50%);background:rgba(90,12,20,.92);border:1px solid #ff5a6a;color:#ffd6db;font-size:12px;padding:6px 10px;border-radius:5px;z-index:4;pointer-events:none;max-width:calc(100% - 16px);text-align:center}
.upr{position:absolute;left:50%;top:128px;transform:translateX(-50%);z-index:5;border-color:var(--yel);color:var(--yel);background:rgba(12,14,17,.95)}
.loose{position:absolute;left:8px;top:90px;background:rgba(12,14,17,.9);border:1px solid #ff9a3c;color:#ffcf9e;font-size:12px;padding:4px 8px;border-radius:4px;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,8,10,.78);z-index:6;padding:16px}
.overlay .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;width:min(460px,100%);max-height:100%;overflow:auto}
.res{display:grid;grid-template-columns:1fr auto auto;gap:3px 14px;font-size:13px;margin:10px 0}.res .n{font-family:var(--f-mono);text-align:right}
pre.code{background:#0a0c0f;border:1px solid var(--line);border-radius:5px;padding:8px;font-family:var(--f-mono);font-size:10.5px;line-height:1.45;max-height:340px;overflow:auto;white-space:pre;color:#cfd6e0}
pre.code .k{color:#ff9e64}pre.code .c{color:#6b7280}pre.code .t{color:#7dcfff}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}

.cbody{position:relative;height:190px}

.plate{position:absolute;inset:6% 4% 30% 4%;background:linear-gradient(#4b4e53,#3a3d42);border:3px solid #141517;border-radius:22% 22% 30% 30%/40% 40% 50% 50%;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.ax{position:absolute;font-family:var(--f-mono);font-size:9px;color:#e0263a;font-weight:700}
.ax.a3{left:12%;top:6%}.ax.a4{left:18%;top:17%}.ax.a2{right:12%;top:6%}.ax.a1{right:18%;top:17%}
.stick{position:absolute;top:26%;width:62px;height:62px;border-radius:50%;background:radial-gradient(#26282c,#0d0e10);border:3px solid #0a0a0b;touch-action:none}
#stL{left:5%}#stR{right:5%}
.stick i{position:absolute;left:12px;top:12px;width:32px;height:32px;border-radius:50%;background:radial-gradient(#4a4d52,#222428);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.lcd{position:absolute;left:31%;right:31%;top:5%;height:40%;background:#b8c1b3;border:3px solid #0d0e10;border-radius:4px;font-family:var(--f-mono);font-size:9px;line-height:1.35;color:#141414;padding:3px 5px;overflow:hidden;white-space:pre}

</style></head><body>

<div id="phoneModal" class="overlay" hidden style="position:fixed;z-index:50"><div class="card">

<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const D2R=Math.PI/180;
const cm=v=>(v*2.54).toFixed(1);
const fx=v=>(Math.round(v*100)/100).toString();
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}

/* =================== MATERIALES =================== */
const M={
  alum:{color:0xc9ced6,metalness:.55,roughness:.38},
  dark:new THREE.MeshStandardMaterial({color:0x1d1f23,roughness:.6,metalness:.1}),
  darker:new THREE.MeshStandardMaterial({color:0x121316,roughness:.7}),
  steel:new THREE.MeshStandardMaterial({color:0x7b828b,metalness:.7,roughness:.35}),
  standoff:new THREE.MeshStandardMaterial({color:0xb4bac2,metalness:.7,roughness:.3}),
  rubber:new THREE.MeshStandardMaterial({color:0x17181b,roughness:.95}),
  hub:new THREE.MeshStandardMaterial({color:0x2c3036,roughness:.5,metalness:.2}),
  roller:new THREE.MeshStandardMaterial({color:0x3b3f46,roughness:.8}),
  gear:new THREE.MeshStandardMaterial({color:new THREE.Color(0xd4202e).convertSRGBToLinear(),roughness:.5}),
  wheelHub:new THREE.MeshStandardMaterial({color:0x111214,roughness:.55}),
  wheelRoller:new THREE.MeshStandardMaterial({color:new THREE.Color(0xdcdcd6).convertSRGBToLinear(),roughness:.7}),
  red:new THREE.MeshStandardMaterial({color:0xd8202f,roughness:.5}),
  green:new THREE.MeshStandardMaterial({color:0x2fc45b,emissive:0x0c4a1c,roughness:.4}),
  chrome:new THREE.MeshStandardMaterial({color:0xdfe3e8,metalness:.85,roughness:.2}),

  pulley:new THREE.MeshStandardMaterial({color:0x2a2c30,roughness:.5}),

  chain:new THREE.MeshStandardMaterial({color:0x55595f,metalness:.7,roughness:.35}),
  tank:new THREE.MeshStandardMaterial({color:0xbfcad2,metalness:.3,roughness:.25,transparent:true,opacity:.85}),
};
const CARTCOL={100:0xd8202f,200:0x2fb24f,600:0x2d86e0};
const holeCache={};
function holeMat(rx,ry){
  const k=rx+'x'+ry;if(holeCache[k])return holeCache[k];
  if(!holeMat.canvas){const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,32,32);g.fillStyle='#000';g.fillRect(10,10,12,12);holeMat.canvas=c;}
  const t=new THREE.CanvasTexture(holeMat.canvas);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.magFilter=THREE.NearestFilter;
  return holeCache[k]=new THREE.MeshStandardMaterial({...M.alum,alphaMap:t,alphaTest:.5,side:THREE.DoubleSide});
}
const edgeMat=new THREE.MeshStandardMaterial({...M.alum});
// caja con hoyos cuadrados VEX (paso 0.5") en las caras perpendiculares al eje delgado
function holedBox(sx,sy,sz,thin){
  const g=new THREE.BoxGeometry(sx,sy,sz);const mats=Array(6).fill(edgeMat);
  const r=v=>Math.max(1,Math.round(v/0.5));
  if(thin==='x'){const m=holeMat(r(sz),r(sy));mats[0]=mats[1]=m;}
  if(thin==='y'){const m=holeMat(r(sx),r(sz));mats[2]=mats[3]=m;}
  if(thin==='z'){const m=holeMat(r(sx),r(sy));mats[4]=mats[5]=m;}
  return new THREE.Mesh(g,mats);
}
function box(sx,sy,sz,mat,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);return m;}
function cylX(r,len,mat,seg=20){const g=new THREE.CylinderGeometry(r,r,len,seg);g.rotateZ(Math.PI/2);return new THREE.Mesh(g,mat);}

/* =================== CONSTRUCTORES DE PIEZAS =================== */
const T=0.04; // grosor del aluminio (≈0.040″)
function cchannel(n,baseHoles){ // largo en X, base en XZ, pestañas hacia +Y. Origen: centro de la base abajo
  const L=n*0.5,W=baseHoles*0.5,g=new THREE.Group();
  const b=holedBox(L,T,W,'y');b.position.y=T/2;g.add(b);
  [1,-1].forEach(s=>{const f=holedBox(L,0.5,T,'z');f.position.set(0,0.25,s*(W/2-T/2));g.add(f);});
  return g;
}
function angle(n){const L=n*0.5,g=new THREE.Group();
  const a=holedBox(L,T,1,'y');a.position.set(0,T/2,0.5);g.add(a);
  const b=holedBox(L,1,T,'z');b.position.set(0,0.5,T/2);g.add(b);return g;}
function plate(n,w){const b=holedBox(n*0.5,T,w*0.5,'y');b.position.y=T/2;const g=new THREE.Group();g.add(b);return g;}
function holeMatG(rx,ry){const k='g'+rx+'x'+ry;if(holeCache[k])return holeCache[k];const m=holeMat(rx,ry).clone();m.color.set(0x9aa1a8);m.metalness=.55;return holeCache[k]=m;}
function slideRail(n){ // riel del Linear Slide: largo en X, alto en Y (0..0.25), ancho 1″ en Z
  const L=n*0.5,g=new THREE.Group(),ms=new THREE.MeshStandardMaterial({color:0x9aa1a8,metalness:.55,roughness:.4});
  const mats=Array(6).fill(ms);mats[2]=mats[3]=holeMatG(Math.round(L/0.5),2);const w=new THREE.Mesh(new THREE.BoxGeometry(L,0.06,1),mats);w.position.y=0.03;g.add(w);
  [1,-1].forEach(s=>{g.add(box(L,0.25,0.06,ms,0,0.125,s*0.47));g.add(box(L,0.05,0.2,ms,0,0.22,s*0.34));});return g;}
function slideTruck(){ // carrito: abraza el riel (mismo origen que el riel)
  const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0x5d6168,roughness:.55});
  g.add(box(2,0.2,1.16,m,0,0.4,0));[1,-1].forEach(s=>g.add(box(2,0.25,0.06,m,0,0.175,s*0.55)));
  g.add(box(1.8,0.1,0.4,m,0,0.25,0));g.add(box(1.8,0.1,0.44,m,0,0.13,0));return g;}
function standoff(len){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CylinderGeometry(0.144,0.144,len,6),M.standoff);g.add(m);return g;}
function shaft(len){const g=new THREE.Group();g.add(box(len,0.125,0.125,M.steel));return g;}
function gear(t){ // eje en X
  const pr=t/48,ad=1/24,dd=1.25/24,sh=new THREE.Shape();
  for(let i=0;i<t;i++){const a=i/t*Math.PI*2,s=Math.PI*2/t;
    const p=[[pr-dd,a],[pr+ad,a+s*0.2],[pr+ad,a+s*0.45],[pr-dd,a+s*0.65]];
    p.forEach(([r,an],j)=>{const x=Math.cos(an)*r,y=Math.sin(an)*r;(i===0&&j===0)?sh.moveTo(x,y):sh.lineTo(x,y);});}
  const hole=new THREE.Path();const h=0.0625;hole.moveTo(-h,-h);hole.lineTo(h,-h);hole.lineTo(h,h);hole.lineTo(-h,h);sh.holes.push(hole);
  if(t>=36){const hr=Math.min(0.085,pr*0.09),rings=t>=60?[[pr*0.62,10],[pr*0.34,4]]:[[pr*0.55,6]];
    rings.forEach(([rr,n])=>{for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.PI/n;const p=new THREE.Path();p.absarc(Math.cos(a)*rr,Math.sin(a)*rr,hr,0,Math.PI*2,true);sh.holes.push(p);}});}
  const geo=new THREE.ExtrudeGeometry(sh,{depth:0.25,bevelEnabled:false,curveSegments:2});geo.translate(0,0,-0.125);geo.rotateY(Math.PI/2);
  const g=new THREE.Group(),sp=new THREE.Group();sp.name='spin';g.add(sp);sp.add(new THREE.Mesh(geo,M.gear));
  return g;
}
const SPK_P=0.375; // paso de cadena HS (in)
const spkR=t=>SPK_P/(2*Math.sin(Math.PI/t));
function sprocket(t){ // eje en X
  const pr=spkR(t),sh=new THREE.Shape(),ro=pr+0.1,ri=pr-0.1;
  for(let i=0;i<t;i++){const a=i/t*Math.PI*2,s=Math.PI*2/t;
    [[ri,a],[ro,a+s*0.3],[ro,a+s*0.5],[ri,a+s*0.8]].forEach(([r,an],j)=>{const x=Math.cos(an)*r,y=Math.sin(an)*r;(i===0&&j===0)?sh.moveTo(x,y):sh.lineTo(x,y);});}
  const geo=new THREE.ExtrudeGeometry(sh,{depth:0.19,bevelEnabled:false,curveSegments:2});geo.translate(0,0,-0.095);geo.rotateY(Math.PI/2);
  const g=new THREE.Group(),sp=new THREE.Group();sp.name='spin';g.add(sp);sp.add(new THREE.Mesh(geo,M.sprk));
  sp.add(box(0.21,pr*0.45,0.08,M.chrome,0,pr*0.5,0));return g;
}
function pulley(){const g=new THREE.Group(),sp=new THREE.Group();sp.name='spin';g.add(sp);
  sp.add(cylX(0.5,0.08,M.pulley,28).translateX(-0.12));sp.add(cylX(0.5,0.08,M.pulley,28).translateX(0.12));sp.add(cylX(0.36,0.2,M.pulley,24));
  sp.add(box(0.3,0.3,0.06,M.darker,0,0.3,0));return g;}
function spoolPart(){const g=new THREE.Group(),sp=new THREE.Group();sp.name='spin';g.add(sp);
  sp.add(cylX(0.72,0.06,M.pulley,28).translateX(-0.28));sp.add(cylX(0.72,0.06,M.pulley,28).translateX(0.28));sp.add(cylX(0.5,0.5,M.rope,24));
  sp.add(box(0.52,0.12,0.12,M.darker,0,0.5,0));return g;}
function wheel(d,w,kind){ // eje en X, grupo interior "spin"
  const r=d/2,g=new THREE.Group(),sp=new THREE.Group();sp.name='spin';g.add(sp);g.userData.radius=r;
  if(kind==='trac'){sp.add(cylX(r,w,M.rubber,32));sp.add(cylX(r*0.62,w+0.02,M.hub,24));
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2;const m=box(w*0.9,0.06,0.2,M.darker);m.position.set(0,Math.cos(a)*(r+0.005),Math.sin(a)*(r+0.005));m.rotation.x=-a;sp.add(m);}
  } else {
    sp.add(cylX(r*0.66,w*0.85,M.hub,28));
    [-1,1].forEach(s=>{const p=cylX(r*0.8,0.08,M.hub,28);p.position.x=s*w*0.3;sp.add(p);});
    const rr=d*0.075,rows=[-1,1],k=Math.max(8,Math.round(2*Math.PI*(r-rr)/(rr*3.3)));
    const Y=new THREE.Vector3(0,1,0);
    rows.forEach((s,ri)=>{for(let i=0;i<k;i++){const a=(i+(ri?0.5:0))/k*Math.PI*2;
      const m=new THREE.Mesh(new THREE.CylinderGeometry(rr*0.8,rr*0.8,rr*2.6,10),M.roller);
      const tan=new THREE.Vector3(0,-Math.sin(a),Math.cos(a));
      let dir=tan;if(kind==='mec')dir=tan.clone().multiplyScalar(0.7071).add(new THREE.Vector3(0.7071*s,0,0)).normalize();
      m.quaternion.setFromUnitVectors(Y,dir);m.position.set(s*w*0.22,Math.cos(a)*(r-rr),Math.sin(a)*(r-rr));sp.add(m);}});
  }
  return g;
}
function motor(big,cart){ // cara de salida en x=0 mirando +X
  const g=new THREE.Group();const [dx,dy,dz]=big?[1.3,2.2,2.0]:[1.1,1.6,1.5];
  g.add(box(dx,dy,dz,M.dark,-dx/2,0,0));
  g.add(box(dx*0.9,0.05,dz*0.7,M.darker,-dx/2,dy/2+0.02,0));
  const sp=new THREE.Group();sp.name='spin';g.add(sp);
  const ring=cylX(big?0.45:0.35,0.06,new THREE.MeshStandardMaterial({color:big?CARTCOL[cart||200]:0x9aa0a6,roughness:.5}),24);ring.position.x=0.0;sp.add(ring);
  sp.add(box(0.06,0.14,0.14,M.darker,-0.02,0,0));sp.add(box(0.05,0.12,0.05,new THREE.MeshStandardMaterial({color:0xffffff}),0.0,big?0.32:0.25,0));
  return g;
}
let screenTex=null;
function brain(){
  const g=new THREE.Group();g.add(box(5.6,1.25,4.4,M.dark,0,0.625,0));
  if(!screenTex){const c=document.createElement('canvas');c.width=256;c.height=160;const x=c.getContext('2d');
    const gr=x.createLinearGradient(0,0,0,160);gr.addColorStop(0,'#0f2a44');gr.addColorStop(1,'#07131f');x.fillStyle=gr;x.fillRect(0,0,256,160);
    x.fillStyle='#e0263a';x.fillRect(0,0,256,14);x.fillStyle='#fff';x.font='bold 11px sans-serif';x.fillText('V5',8,11);
    x.font='bold 38px sans-serif';x.fillStyle='#dfe8f0';x.fillText('VEX V5',50,95);screenTex=new THREE.CanvasTexture(c);}
  const s=new THREE.Mesh(new THREE.PlaneGeometry(4.1,2.6),new THREE.MeshStandardMaterial({map:screenTex,emissive:0xffffff,emissiveMap:screenTex,emissiveIntensity:.55,roughness:.2}));
  s.rotation.x=-Math.PI/2;s.position.set(-0.3,1.26,0);g.add(s);
  g.add(box(0.35,0.08,0.35,M.red,2.35,1.27,-1.6));
  return g;
}
function battery(){const g=new THREE.Group();g.add(box(5.3,2.1,2.5,M.dark,0,1.05,0));g.add(box(5.32,0.3,2.52,M.red,0,1.7,0));return g;}
function radio(){const g=new THREE.Group();g.add(box(2.2,0.6,1.3,M.dark,0,0.3,0));g.add(box(0.2,0.06,0.2,M.green,0.8,0.62,0.4));return g;}
function lineTracker(){const g=new THREE.Group();g.add(box(0.75,0.3,1.1,M.dark,0,0.15,0));const l=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.03,14),M.red);l.position.y=0.005;g.add(l);return g;}
function sensor(sx,sy,sz){const g=new THREE.Group();g.add(box(sx,sy,sz,M.dark,0,sy/2,0));const l=new THREE.Mesh(new THREE.CylinderGeometry(Math.min(sx,sz)*0.2,Math.min(sx,sz)*0.2,0.04,16),M.red);l.position.y=sy+0.02;g.add(l);return g;}
function pneuCyl(stroke){const g=new THREE.Group();const L=1.3+stroke;const b=cylX(0.31,L,M.chrome,18);b.position.x=-L/2;g.add(b);
  const rod=cylX(0.12,stroke*0.35+0.3,M.steel,12);rod.position.x=(stroke*0.35+0.3)/2;g.add(rod);return g;}
function airTank(){const g=new THREE.Group();g.add(cylX(0.75,5.2,M.tank,24));[-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.75,20,10),M.tank);e.scale.x=0.3;e.position.x=s*2.6;g.add(e);});return g;}

/* ---- objetos de prueba (Override) ---- */
const PINCOL={RR:[0xe0213b,0xe0213b],BB:[0x3cc3e6,0x3cc3e6],RY:[0xe0213b,0xf2e04a],BY:[0x3cc3e6,0xf2e04a],YY:[0xf2e04a,0xf2e04a],RB:[0xe0213b,0x3cc3e6]}; // [arriba, abajo]
function pinObj(col='RY'){ // forma real: dos conos unidos por un collar al centro (6.5" alto, collar 3.16")

/* ---- tornillos: se ponen en el centro del hoyo y calculan cuánto atraviesan ---- */
const SCREW_LENS=[0.25,0.375,0.5,0.625,0.75,1,1.25,1.5,2];
function ownerPart(obj){while(obj&&obj.userData.uid===undefined)obj=obj.parent;return obj?partBy(obj.userData.uid):null;}
const isFast=o=>{const p=ownerPart(o);return p&&PART[p.type].fast;};
function placeScrew(hit){
  const o=hit.object,mats=o.material,mat=Array.isArray(mats)?mats[hit.face.materialIndex]:null;
  if(!mat||!mat.alphaMap){toast(isFast(o)?'Ahí ya hay tornillería':'Toca un hoyo de una pieza de metal');return;}
  const host=ownerPart(o);if(!host)return;
  const gp=o.geometry.parameters,S=[gp.width,gp.height,gp.depth],n=hit.face.normal.clone();
  const a=Math.abs(n.x)>.5?0:Math.abs(n.y)>.5?1:2;
  const L=o.worldToLocal(hit.point.clone()).toArray();
  for(let i=0;i<3;i++){if(i===a){L[i]=Math.sign(n.getComponent(a))*S[i]/2;continue;}const sz=S[i];if(sz<0.45){L[i]=0;continue;}
    let k=Math.round((L[i]+sz/2-0.25)/0.5);k=clamp(k,0,Math.round(sz/0.5)-1);L[i]=-sz/2+0.25+k*0.5;}
  robot.updateMatrixWorld(true);
  const p=o.localToWorld(new THREE.Vector3(...L)),nw=n.clone().transformDirection(o.matrixWorld).normalize();
  // ¿cuánto material atraviesa? (piezas pegadas, huecos < 0.3")
  const rc=new THREE.Raycaster(p.clone().addScaledVector(nw,0.002),nw.clone().negate(),0,2.2);
  let last=0.04;for(const h of rc.intersectObject(robot,true)){if(isFast(h.object))continue;if(h.distance-last>0.3)break;last=Math.max(last,h.distance);}
  const grip=Math.round(last*1000)/1000,ftype=$('#scrType').value;
  const r3=v=>v.toArray().map(x=>Math.round(x*1000)/1000),rotOf=q=>{const e=new THREE.Euler().setFromQuaternion(q,'YXZ');return [e.x,e.y,e.z].map(r=>Math.round(r/D2R*10)/10);};
  if(ftype==='sh'){ // eje cuadrado que atraviesa el hoyo: sale igual por los dos lados
    const len=+$('#scrLen').value||3;const c=p.clone().addScaledVector(nw,-grip/2);
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0),nw);
    const sh=part('sh',r3(c),rotOf(q),{n:len},host.mech);design.parts.push(sh);rebuild();select(sh.uid);save();
    toast(`Eje ${len}″ metido en el hoyo · ponle engranes, ruedas o collares`);return;}
  if(ftype==='so'){ // standoff hacia afuera + tornillo por detrás que lo sujeta
    const len=+$('#scrLen').value||1;const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),nw);
    const so=part('so',r3(p.clone().addScaledVector(nw,len/2)),rotOf(q),{n:len},host.mech);design.parts.push(so);
    const need=grip+0.2,sl=SCREW_LENS.find(v=>v>=need)||2,qs=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),nw.clone().negate());
    design.parts.push(part('scr',r3(p.clone().addScaledVector(nw,-grip)),rotOf(qs),{n:sl},host.mech));
    rebuild();select(so.uid);save();toast(`Standoff ${len}″ atornillado · pon otra pieza en su punta con otro tornillo`);return;}
  const nut=$('#scrNut').value,need=grip+(nut?0.13:0.05);
  const lenSel=$('#scrLen').value,len=lenSel==='auto'?(SCREW_LENS.find(v=>v>=need)||2):+lenSel;
  if(lenSel!=='auto'&&len<need)toast(`Aviso: ese tornillo es corto, atraviesa ${fx(grip)}″`);
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),nw),rot=rotOf(q);
  const sc=part('scr',r3(p),rot,{n:len},host.mech);design.parts.push(sc);
  if(nut)design.parts.push(part(nut,r3(p.clone().addScaledVector(nw,-grip)),[...rot],{},host.mech));
  rebuild();save();toast(`Tornillo ${len}″ · atraviesa ${fx(grip)}″`);
}
/* ---- herramienta cadena ---- */
let chainFirst=null;
function chainClick(p){
  if(!p||!p.type.startsWith('s')||!PART[p.type].rk||PART[p.type].rk!=='spk'){toast('Toca un sprocket');return;}
  if(!chainFirst){chainFirst=p.uid;toast('Ahora toca el otro sprocket');return;}
  if(chainFirst===p.uid){toast('Es el mismo sprocket');return;}
  const A=kin.nodes.get(chainFirst),B=kin.nodes.get(p.uid);chainFirst=null;
  if(!A||!B)return;
  if(Math.abs(A.a.dot(B.a))<0.99){toast('Los sprockets deben tener ejes paralelos');return;}
  if(Math.abs(B.c.clone().sub(A.c).dot(A.a))>0.3){toast('Los sprockets deben quedar alineados (misma línea)');return;}
  if(A.p.mech!==B.p.mech){toast('Los dos sprockets deben estar en la misma parte del robot');return;}
  if((design.chains||[]).some(c=>(c.a===A.uid&&c.b===B.uid)||(c.a===B.uid&&c.b===A.uid))){toast('Ya tienen cadena');return;}
  design.chains.push({a:A.uid,b:B.uid});rebuild();save();toast('Cadena puesta');
}

function connectedSet(uid){
  robot.updateMatrixWorld(true);
  const par={};const f=x=>par[x]===undefined||par[x]===x?(par[x]=x):(par[x]=f(par[x]));const U=(a,b)=>{par[f(a)]=f(b);};
  const Y=new THREE.Vector3(0,1,0),pt=new THREE.Vector3(),loc=new THREE.Vector3();
  const others=design.parts.filter(p=>p.type!=='scr'&&meshes[p.uid]);
  const inside=(p,w)=>{let hit=false;meshes[p.uid].traverse(m=>{if(hit||!m.isMesh)return;if(!m.geometry.boundingBox)m.geometry.computeBoundingBox();
    loc.copy(w);m.worldToLocal(loc);const b=m.geometry.boundingBox;if(loc.x>b.min.x-0.03&&loc.x<b.max.x+0.03&&loc.y>b.min.y-0.03&&loc.y<b.max.y+0.03&&loc.z>b.min.z-0.03&&loc.z<b.max.z+0.03)hit=true;});return hit;};
  design.parts.filter(p=>p.type==='scr'&&meshes[p.uid]).forEach(s=>{
    const o=meshes[s.uid];const ax=Y.clone().applyQuaternion(o.getWorldQuaternion(new THREE.Quaternion()));const p0=o.getWorldPosition(new THREE.Vector3());
    others.forEach(p=>{for(let t=0.02;t<=s.params.n;t+=0.05){pt.copy(p0).addScaledVector(ax,-t);if(inside(p,pt)){U(s.uid,p.uid);break;}}});
  });
  const root=f(uid);return design.parts.filter(p=>par[p.uid]!==undefined&&f(p.uid)===root).map(p=>p.uid);
}

  const so=meshes[sel];so.updateMatrix();dragGrp={inv:so.matrix.clone().invert(),list:ids.map(id=>{const o=meshes[id];o.updateMatrix();return {id,m0:o.matrix.clone()};})};

let carry=[];

    if(chain.some(c=>Math.hypot(q._p.x-c._p.x,q._p.z-c._p.z)<STACK_TOL&&q._p.y>c._p.y+0.1)){chain.push(q);grew=true;}});}

function moveGroup(){

}

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let down=null;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});

function rotorInfoHTML(p){

  else h+=`<div class="kv"><span>La gira</span><b>${movers.length?movers.map(([mu,mp])=>`${nm(mu)} ×${Math.abs(mp.get(p.uid).k).toFixed(2)}`).join(', '):'ningún motor'}</b></div>`;
  if(d.rk==='spk'){const cs=(design.chains||[]).filter(c=>c.a===p.uid||c.b===p.uid);
    h+=cs.length?cs.map((c,i)=>`<div class="row" style="margin-top:4px"><span class="note">Cadena con ${nm(c.a===p.uid?c.b:c.a)}</span><button class="btn danger" data-rmch="${design.chains.indexOf(c)}">Quitar cadena</button></div>`).join(''):
      `<div class="note" style="margin-top:4px">Sin cadena. Usa la herramienta Cadena (C) y toca otro sprocket.</div>`;}

}
function syncPart(p){const o=meshes[p.uid];if(!o)return;o.position.fromArray(p.pos);o.rotation.set(p.rot[0]*D2R,p.rot[1]*D2R,p.rot[2]*D2R);updateSelBox();analyze();buildChains();updateRopes(true);save();computeStats();renderMechs();}
function dupSel(){const ids=selIds();if(!ids.length)return;const map={};
  const nw=ids.map(u=>{const p=partBy(u),q=part(p.type,[p.pos[0]+1,p.pos[1],p.pos[2]],[...p.rot],{...p.params},p.mech);map[u]=q.uid;return q;});design.parts.push(...nw);
  (design.chains||[]).slice().forEach(c=>{if(map[c.a]&&map[c.b])design.chains.push({a:map[c.a],b:map[c.b]});});
  rebuild();select(nw[0].uid);nw.slice(1).forEach(q=>multi.add(q.uid));updateSelBox();renderSel();save();toast(nw.length>1?`${nw.length} piezas duplicadas`:'Pieza duplicada');}
function rotateSel(i){ // gira toda la selección 90° alrededor de la pieza principal
  const ids=selIds();if(!ids.length)return;const so=meshes[sel];so.updateMatrix();const inv=so.matrix.clone().invert();
  const ax=new THREE.Vector3(i===0?1:0,i===1?1:0,i===2?1:0).applyQuaternion(so.quaternion);
  const R4=new THREE.Matrix4().makeTranslation(so.position.x,so.position.y,so.position.z).multiply(new THREE.Matrix4().makeRotationAxis(ax,Math.PI/2)).multiply(new THREE.Matrix4().makeTranslation(-so.position.x,-so.position.y,-so.position.z));
  ids.forEach(u=>{const o=meshes[u],p=partBy(u);o.updateMatrix();R4.clone().multiply(o.matrix).decompose(o.position,o.quaternion,o.scale);o.scale.set(1,1,1);o.rotation.setFromQuaternion(o.quaternion,'YXZ');
    p.pos=o.position.toArray().map(v=>Math.round(v*1000)/1000);p.rot=[o.rotation.x,o.rotation.y,o.rotation.z].map(r=>Math.round(r/D2R*10)/10);});
  updateSelBox();analyze();buildChains();updateRopes(true);save();computeStats();renderMechs();}
function delSel(){if(sel){const ids=new Set(selIds());design.parts=design.parts.filter(p=>!ids.has(p.uid));design.chains=(design.chains||[]).filter(c=>!ids.has(c.a)&&!ids.has(c.b));tc.detach();rebuild();select(null);save();if(ids.size>1)toast(`${ids.size} piezas borradas`);}
  else if(selObj){design.objs=design.objs.filter(o=>o.uid!==selObj);rebuildObjs();select(null);save();}}

function bindMech(m){
  const el=$('#mechPan');const det=el.querySelector(`details[data-mid="${m.id}"]`);det.ontoggle=()=>m._open=det.open;
  el.querySelectorAll(`[data-m="${m.id}"]`).forEach(inp=>inp.onchange=()=>{

    else{const k=inp.dataset.k;let v=inp.type==='checkbox'?inp.checked:inp.value;if(['min','max','speed','stages'].includes(k))v=+v;
      if(k==='parent'&&isDesc(v,m.id))return renderMechs();m[k]=v;}
    if(inp.dataset.k==='stages'){design.parts.forEach(p=>{const [id,s]=p.mech.split(':');if(id===m.id&&+s>m.stages)p.mech=m.id+':'+m.stages;});}
    rebuild();save();renderMechs();renderSel();renderTest();});
  el.querySelectorAll(`[data-piv="${m.id}"]`).forEach(b=>b.onclick=()=>{const p=sel&&partBy(sel);if(!p){b.textContent='Selecciona una pieza primero';return;}m[b.dataset.which]=[...p.pos];rebuild();save();renderMechs();});
  el.querySelectorAll(`[data-key="${m.id}"]`).forEach(b=>b.onclick=()=>{waitKey={m,k:b.dataset.kk,b};b.classList.add('wait');b.textContent='Presiona tecla… (Esc = ninguna)';});
  const dl=el.querySelector(`[data-delm="${m.id}"]`);dl.onclick=()=>{
    design.parts.forEach(p=>{if(p.mech.startsWith(m.id+':'))p.mech=m.parent||'root';});
    design.mechs.forEach(o=>{if(o.parent.startsWith(m.id+':'))o.parent=m.parent||'root';});
    design.mechs=design.mechs.filter(x=>x!==m);rebuild();save();renderMechs();renderSel();renderTest();};
}
function isDesc(parentKey,id){let k=parentKey;const seen=new Set();while(k&&k!=='root'&&!seen.has(k)){seen.add(k);const pid=k.split(':')[0];if(pid===id)return true;const pm=mechById(pid);k=pm?pm.parent:null;}return false;}
function addMech(t){
  const id='m'+(uid++);const tgt=orbit.target;const c=[Math.round(tgt.x),Math.round(tgt.y),Math.round(tgt.z)];
  const base={id,name:MT[t],type:t,axis:t==='rotate'?'x':'y',value:0,min:0,max:10,speed:12,keyUp:'',keyDown:'',keyToggle:'',parent:'root',pivot:c,_open:true};

function robotTouchingWall(){if(!footprint)return false;const b=footprint;return [[b.min.x,b.min.z],[b.max.x,b.min.z],[b.min.x,b.max.z],[b.max.x,b.max.z]].map(([x,z])=>robot.localToWorld(new THREE.Vector3(x,0,z))).some(c=>c.x<FMIN+0.4||c.x>FMAX-0.4||c.z<FMIN+0.4||c.z>FMAX-0.4);}
function computeScore(final){
  // qué pila está en qué base
  const byUid=new Map(design.objs.map(o=>[o.uid,o]));
  const rootGoal=o=>{let q=o,n=0;while(q&&n<25){if(q.held)return -1;if(q.onGoal>=0)return q.onGoal;q=q.rest?byUid.get(q.rest):null;n++;}return -1;};
  const pts={R:0,B:0},halves={R:0,B:0,Y:0},pinsOn={R:new Map(),B:new Map()},lines=[];
  const mid=final&&robotInMid()?myAlliance:null;
  design.objs.forEach(o=>{if(o.type!=='pin')return;const gi=rootGoal(o);if(gi<0)return;const g=GOALS[gi];
    const below=o.rest?byUid.get(o.rest):null,above=design.objs.find(q=>q.rest===o.uid&&q.type==='cup');
    const [top,bot]=(o.col||'RY').split('');
    // cubierta: el vaso de abajo tapa la mitad de abajo del pin con su mitad de arriba; el de arriba tapa la de arriba con su mitad de abajo
    const botVis=!(below&&below.type==='cup'&&below.flip),topVis=!(above&&!above.flip);
    let owner=null;if(g.t==='C')owner=mid;else{const q=QUAD(g.x,g.y);const t=TOGGLES.find(t=>t.id===q);owner=t&&t.color&&!(final&&t.touch)?(t.color===1?'R':'B'):null;}
    const got={R:false,B:false};
    [[bot,botVis],[top,topVis]].forEach(([c,vis])=>{if(!vis)return;if(c==='R'){pts.R+=5;halves.R++;got.R=true;}else if(c==='B'){pts.B+=5;halves.B++;got.B=true;}else{halves.Y++;if(owner){pts[owner]+=10;got[owner]=true;}}});
    ['R','B'].forEach(a=>{if(got[a])pinsOn[a].set(gi,(pinsOn[a].get(gi)||0)+1);});});
  const midPts=mid?8:0;if(mid)pts[mid]+=8;

}
function evalAWP(sc){const a=myAlliance;let pins=0,goals2=0;

const CARTR={100:'ratio36_1',200:'ratio18_1',600:'ratio6_1'};
function ident(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+(.)?/g,(m,c)=>c?c.toUpperCase():'').replace(/^[^A-Za-z]+/,'')||'Mecanismo';}
function autoPorts(){const used=new Set(design.parts.filter(p=>PART[p.type].rk==='motor'&&p.params.port).map(p=>+p.params.port));const map=new Map();let n=1;
  const dm=new Set((driveInfo.motors||[]).map(d=>d.mu));
  const order=[...design.parts.filter(p=>PART[p.type].rk==='motor'&&dm.has(p.uid)).sort((a,b)=>(b.pos[0]>0)-(a.pos[0]>0)),...design.parts.filter(p=>PART[p.type].rk==='motor'&&!dm.has(p.uid))];
  order.forEach(p=>{if(p.params.port){map.set(p.uid,+p.params.port);return;}while(used.has(n)||n===21)n++;used.add(n);map.set(p.uid,n);});return map;}
function genCode(){
  const ports=autoPorts(),dm=driveInfo.motors||[],L=[],Rt=[],lines=[];const cart=p=>PART[p.type].w===11?(CARTR[p.params.cart||200]):'ratio18_1';

  if(dm.length){push('// ---- Tracción ----');
    dm.forEach((d,i)=>{const p=partBy(d.mu),left=d.w.p.pos[0]>0;const nm=(left?'Izq':'Der')+(left?L.length+1:Rt.length+1);(left?L:Rt).push('Trac'+nm);

    push(`motor_group LadoIzq = motor_group(${L.join(', ')});`,`motor_group LadoDer = motor_group(${Rt.join(', ')});`,'');}

    if(d.cyl){push(`digital_out ${id} = digital_out(Brain.ThreeWirePort.A);  // cilindro neumático`);return;}
    const p=partBy(d.motor);const deg=(m.type==='cascade'||m.type==='slide')?`// ${fx(m.max)}″ de recorrido = ${Math.round(m.max/Math.abs(d.ratio)*180/Math.PI)}° del motor`:`// ${fx(m.max-m.min)}° del mecanismo = ${Math.round((m.max-m.min)/Math.abs(d.ratio)*180/Math.PI)}° del motor`;
    push(`motor ${id}Motor = motor(PORT${ports.get(d.motor)}, ${cart(p)}, ${d.ratio<0?'true':'false'});  ${deg}`);});
  push('','// grados del motor por unidad del mecanismo (″ o °), según tus engranes / carrete');
  mechs.forEach(({m,id})=>{const d=m._drv;if(!d||d.cyl)return;const k=(180/Math.PI)/Math.abs(d.ratio);push(`const double ${id}_GRADOS = ${k.toFixed(3)};  const double ${id}_MIN = ${fx(m.min)}, ${id}_MAX = ${fx(m.max)};`);});
  {const T=design.parts.filter(p=>p.type==='ltr').sort((a,b)=>b.pos[0]-a.pos[0]);if(T.length){push('','// ---- Sensores de línea (3-wire, puertos A, B, C...) ----');
    const nmL=(i)=>T.length===1?'Linea':i===0?'LineaIzq':i===T.length-1?'LineaDer':'LineaCentro'+i;T.forEach((p,i)=>push(`line ${nmL(i)} = line(Brain.ThreeWirePort.${'ABCDEFGH'[i]});`));
    if(T.length>=2&&dm.length)push('','// Sigue la cinta blanca: si el sensor izquierdo ve más blanco, gira a la izquierda','void seguirLinea(int ms) {','  timer t;','  while (t.time(msec) < ms) {',`    double error = ${nmL(0)}.reflectivity() - ${nmL(T.length-1)}.reflectivity();`,'    LadoIzq.spin(forward, 35 - error * 0.55, percent);','    LadoDer.spin(forward, 35 + error * 0.55, percent);','    wait(10, msec);','  }','  LadoIzq.stop(brake);','  LadoDer.stop(brake);','}');}}
  push('','void pre_auton() {');mechs.forEach(({m,id})=>{if(m._drv&&!m._drv.cyl)push(`  ${id}Motor.setPosition(0, degrees);  ${id}Motor.setStopping(hold);`);});push('}','',
    'void autonomous() {',...(autoCode(ident,mechs)||['  // Tu rutina de 15 s. Grábala en Probar > "Autónomo grabado" y aparece aquí.','  // Ejemplo: avanzar 24"','  // LadoIzq.spinFor(forward, 24 / (3.25 * 3.1416) * 360, degrees, false);','  // LadoDer.spinFor(forward, 24 / (3.25 * 3.1416) * 360, degrees);']),'}','');
  const B=b=>b?`Controller1.Button${b}`:null;
  mechs.forEach(({m,id})=>{if(!m._drv||!m.btnToggle)return;const d=m._drv;
    push(`bool ${id}Arriba = false;`,`void alternar${id}() {`,`  ${id}Arriba = !${id}Arriba;`,
      d.cyl?`  ${id}.set(${id}Arriba);`:`  ${id}Motor.spinToPosition((${id}Arriba ? ${id}_MAX : ${id}_MIN) * ${id}_GRADOS, degrees, ${m.pct??100}, velocityUnits::pct, false);`,'}','');});
  push('void usercontrol() {');

    else{const tx=ctl.mode==='arcade1'?'Axis4':'Axis1';push('    int avanza = Controller1.Axis3.position();',`    int gira = Controller1.${tx}.position();`,'    LadoIzq.spin(forward, avanza + gira, percent);','    LadoDer.spin(forward, avanza - gira, percent);');}}
  mechs.forEach(({m,id})=>{const d=m._drv;if(!d||d.cyl||!(m.btnUp||m.btnDown))return;
    push(`    // ${m.name}`,`    if (${B(m.btnUp)||'false'}.pressing() && ${id}Motor.position(degrees) < ${id}_MAX * ${id}_GRADOS) ${id}Motor.spin(forward, ${m.pct??100}, percent);`.replace('false.pressing()','false'),
      `    else if (${B(m.btnDown)||'false'}.pressing() && ${id}Motor.position(degrees) > ${id}_MIN * ${id}_GRADOS) ${id}Motor.spin(reverse, ${m.pct??100}, percent);`.replace('false.pressing()','false'),
      `    else if (!${id}Motor.isSpinning()) ${id}Motor.stop(hold);`);});
  push('    wait(20, msec);','  }','}','','int main() {','  Competition.autonomous(autonomous);','  Competition.drivercontrol(usercontrol);','  pre_auton();','  while (true) wait(100, msec);','}');
  return lines.join('\n');
}

function readRemote(){

  if(!pr&&hostData&&performance.now()-hostData.t<2500)pr=hostData;
  const was=remote.on;remote.on=!!pr;
  if(pr){const a=Array.isArray(pr.ax)?pr.ax:[0,0,0,0];remote.ax={1:+a[0]||0,2:+a[1]||0,3:+a[2]||0,4:+a[3]||0};remote.b=Array.isArray(pr.b)?pr.b.filter(x=>BTNS.includes(x)):[];
    const c=Array.isArray(pr.cam)?[+pr.cam[0]||0,+pr.cam[1]||0]:null;
    if(c&&lastCam){const dy=c[0]-lastCam[0],dp=c[1]-lastCam[1];if(Math.abs(dy)+Math.abs(dp)>1e-4)applyCamDelta(dy,dp);}lastCam=c;}
  else{remote.ax={1:0,2:0,3:0,4:0};remote.b=[];lastCam=null;}
  if(remote.on!==was){toast(remote.on?'📱 Cel conectado como control':'📱 Cel desconectado');const st=$('#pmState');if(st)st.textContent=remote.on?'¡Conectado! Cierra esta ventana y entra a Probar.':'Esperando al cel…';
    if(remote.on){$('#bPhone').textContent='📱 Cel conectado';if(mode!=='test')setMode('test');}else $('#bPhone').textContent='📱 Cel como control';}
}

function applyCamDelta(dyaw,dpitch){

  if(mode==='test'&&camMode==='top')return;

  sp.theta-=dyaw;sp.phi=clamp(sp.phi-dpitch,0.15,Math.PI*0.49);cam.position.copy(orbit.target).add(new THREE.Vector3().setFromSpherical(sp));cam.lookAt(orbit.target);
}

  const d=edgeE(E)-(EDGES[E].o[0]*tip.cg.x+EDGES[E].o[2]*tip.cg.z),h=tip.cg.y;tip.w+=0.5*hv*Math.max(0,h-2)/(tip.k2+d*d+h*h);}
function tipStep(dt){if(!physOn){if(tip.edge)uprightRobot();return;}
  tip.t-=dt;if(tip.t<=0||!tip.cg||!tip.sup)tipRefresh();if(!tip.cg||!tip.sup)return;const c=tip.cg,g=386;
  const oc=E=>EDGES[E].o[0]*c.x+EDGES[E].o[2]*c.z,push=E=>-(aL*EDGES[E].o[0]+aF*EDGES[E].o[2]);
  if(!tip.edge){let best=null,bt=0;for(const E in EDGES){const d=edgeE(E)-oc(E),t=push(E)*c.y-g*d;if(t>bt){bt=t;best=E;}}if(!best)return;startTip(best);}
  const E=tip.edge,d=edgeE(E)-oc(E),h=c.y,th=tip.th;
  const xo=-d*Math.cos(th)+h*Math.sin(th),ho=h*Math.cos(th)+d*Math.sin(th);
  tip.w+=(g*xo+(tip.down?0:push(E))*ho)/(tip.k2+d*d+h*h)*dt;tip.w*=1-0.8*dt;let nt=th+tip.w*dt;
  if(nt<=0){if(tip.w<-2&&hitsOn)onImpact(Math.abs(tip.w)*Math.max(4,h)*0.5);tip.edge=null;tip.th=0;tip.w=0;tip.down=false;$('#uprightBtn').hidden=true;applyPose();return;}
  const lim=contactLimit(E,nt);
  if(lim!==null){nt=lim;const hw=tip.w;tip.w=hw>0?-0.2*hw:hw;if(Math.abs(tip.w)<0.25)tip.w=0;if(hw>1.5&&hitsOn)onImpact(hw*Math.max(6,h)*0.6);}
  tip.th=Math.min(nt,Math.PI*0.62);if(tip.th>=Math.PI*0.62)tip.w=0;
  if(!tip.down&&tip.th>0.3&&-d*Math.cos(tip.th)+h*Math.sin(tip.th)>0&&Math.abs(tip.w)<0.3){tip.down=true;$('#uprightBtn').hidden=false;
    toast(`¡El robot se volteó ${EDGES[E].n}! Toca "Enderezar" (tecla R)`);}
  applyPose();}
function uprightRobot(){resetTip();applyPose();toast('Robot enderezado');}

/* =================== LOOP =================== */
function resize(){const r=view.getBoundingClientRect();renderer.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(mode==='test'){pollCtrl();simStep(dt);matchStep(dt);drawLcd(dt);}else readRemote();
  updateCam(dt);if(orbit.enabled)orbit.update();updateDims();updateCG();if(selBox.visible)updateSelBox();updateLabels();renderer.render(scene,cam);}
rebuild();footprint=chassisFootprint();
const _rb=rebuild;rebuild=function(){_rb();footprint=chassisFootprint();};
renderMechs();renderSel();hud();updUndo();requestAnimationFrame(loop);
})();
</script>
