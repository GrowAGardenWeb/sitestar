<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>Recursos Visuales y Gráficos – EQUIPO5</title>
<meta name="description" content="Presentación interactiva: Recursos Visuales y Gráficos para apoyar a la comunidad.">
<meta property="og:title" content="Recursos Visuales y Gráficos – EQUIPO5">
<meta property="og:image" content="img/1.webp">
<style>
:root{--blue:#2f5bff;--ink:#0b1020}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.55) saturate(1.3);transform:scale(1.15);transition:background-image .6s}
#stage{position:fixed;inset:0;overflow:hidden;display:grid;place-items:center;perspective:1600px}
#deck{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;overflow:hidden;background:#000;box-shadow:0 20px 80px rgba(0,0,0,.6);border-radius:clamp(0px,1vw,14px)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;will-change:transform,opacity}
.slide img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
.slide.active{opacity:1;visibility:visible;z-index:2}
.slide.leaving{visibility:visible;z-index:1}

/* --- transiciones de entrada / salida --- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}
@keyframes zoomOut{to{opacity:0;transform:scale(.8)}}
@keyframes slideInR{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideOutL{to{transform:translateX(-35%);opacity:.3}}
@keyframes slideInL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes slideOutR{to{transform:translateX(35%);opacity:.3}}
@keyframes flipIn{from{opacity:0;transform:rotateY(-90deg)}to{opacity:1;transform:none}}
@keyframes flipOut{to{opacity:0;transform:rotateY(90deg)}}
@keyframes riseIn{from{opacity:0;transform:translateY(60%) scale(.9)}to{opacity:1;transform:none}}
@keyframes sinkOut{to{opacity:0;transform:translateY(-30%) scale(1.05)}}
@keyframes spinIn{from{opacity:0;transform:rotate(-8deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes spinOut{to{opacity:0;transform:rotate(8deg) scale(1.3)}}
@keyframes wipeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blurOut{to{opacity:0;filter:blur(18px)}}

.fx-fade .in{animation:fadeIn .8s both}.fx-fade .out{animation:fadeOut .8s both}
.fx-zoom .in{animation:zoomIn .9s cubic-bezier(.2,.8,.2,1) both}.fx-zoom .out{animation:zoomOut .9s both}
.fx-slide.fwd .in{animation:slideInR .8s cubic-bezier(.7,0,.2,1) both}.fx-slide.fwd .out{animation:slideOutL .8s cubic-bezier(.7,0,.2,1) both}
.fx-slide.back .in{animation:slideInL .8s cubic-bezier(.7,0,.2,1) both}.fx-slide.back .out{animation:slideOutR .8s cubic-bezier(.7,0,.2,1) both}
.fx-flip .in{animation:flipIn .9s .25s both}.fx-flip .out{animation:flipOut .5s both}
.fx-rise .in{animation:riseIn .9s cubic-bezier(.2,.9,.3,1) both}.fx-rise .out{animation:sinkOut .9s both}
.fx-spin .in{animation:spinIn .9s cubic-bezier(.2,.9,.3,1) both}.fx-spin .out{animation:spinOut .9s both}
.fx-wipe .in{animation:wipeIn .9s cubic-bezier(.7,0,.2,1) both}.fx-wipe .out{animation:blurOut .9s both}
.slide.active .kb{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.035)}}

/* --- botón JUGAR sobre la portada --- */
#play{position:absolute;left:23.8%;top:82.6%;width:51%;height:14.2%;border:0;border-radius:1.6vw;background:transparent;cursor:pointer;z-index:5;
  animation:pulse 1.8s ease-in-out infinite;transition:background .2s,transform .15s}
#play:hover{background:rgba(255,255,255,.14);transform:scale(1.015)}
#play:active{transform:scale(.98)}
#play:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,91,255,.7)}60%{box-shadow:0 0 0 1.6vw rgba(47,91,255,0)}}
body.playing #play{display:none}
#gato{position:absolute;top:.8%;right:1.2%;height:15.5%;width:auto;aspect-ratio:9/16;object-fit:cover;border-radius:10%;border:.35vw solid #fff;box-shadow:0 .6vw 1.8vw rgba(0,0,0,.45);z-index:5;pointer-events:none;opacity:0;transform:scale(0) rotate(-25deg)}
.slide.active #gato.show{animation:pop .7s 1s cubic-bezier(.3,1.6,.5,1) forwards,wob 2.4s 1.8s ease-in-out infinite}
@keyframes pop{to{opacity:1;transform:scale(1) rotate(6deg)}}
@keyframes wob{0%,100%{transform:rotate(6deg) scale(1);opacity:1}50%{transform:rotate(-6deg) scale(1.08);opacity:1}}

/* --- pantalla completa "forzada" en móvil vertical: gira la presentación 90° --- */
@media (orientation:portrait){
  body.rot #stage{inset:auto;top:0;left:100%;width:100dvh;height:100dvw;transform-origin:0 0;transform:rotate(90deg)}
  body.rot #deck{width:min(100dvh,calc(100dvw*16/9));border-radius:0}
}

/* --- pantalla de carga (estilo Roblox PC) --- */
#loader{position:absolute;inset:0;z-index:50;overflow:hidden;background:#111;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif}
#loader.on{opacity:1;visibility:visible}
#loader .lbg{position:absolute;inset:-6%;background:url(img/fondo.webp) center/cover;filter:blur(2.2vw) brightness(.8) saturate(1.2);transform:scale(1.25)}
#loader .card{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(62%,60vh*1.9);padding:12% 5% 5%;margin-top:3%;border-radius:1vw;background:rgba(30,30,32,.72);backdrop-filter:blur(6px);text-align:center;font-size:min(2.4vw,4.2vh)}
#loader .icon{position:absolute;left:50%;top:0;translate:-50% -52%;width:26%;aspect-ratio:1;border-radius:6%;object-fit:cover;box-shadow:0 .5vw 2vw rgba(0,0,0,.5)}
#loader h2{font-size:1.3em;font-weight:700;line-height:1.2}
#loader .by{margin-top:.5em;font-size:1.05em;color:#c8c8cc}
#loader .join{position:absolute;left:0;right:0;bottom:5%;display:flex;justify-content:center;align-items:center;gap:.6em;font-size:min(1.6vw,2.8vh);color:#ddd}
#loader .spin{width:1.2em;height:1.2em;border-radius:50%;border:.14em solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{rotate:360deg}}
#loader .x{position:absolute;left:3%;top:5%;width:min(4.4vw,8vh);height:min(4.4vw,8vh);border:0;background:none;cursor:pointer;padding:0}
#loader .x::before,#loader .x::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:.35vw;min-height:3px;background:#fff;border-radius:3px;rotate:45deg}
#loader .x::after{rotate:-45deg}
#confetti{position:absolute;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
@media (prefers-reduced-motion:reduce){.slide *,.slide{animation-duration:.01s!important}#play{animation:none}}
</style>
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div id="bg"></div>
<main id="stage">
<div id="deck" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<div id="loader" aria-live="polite"><div class="lbg"></div><button class="x" id="skip" aria-label="Saltar carga"></button>
<div class="card"><img class="icon" src="img/icono.webp" alt=""><h2>Recursos Visuales y gráficos<br>para apoyar a la comunidad</h2><div class="by">EQUIPO5</div></div>
<div class="join"><span class="spin"></span><span id="tip">Uniéndose al servidor</span></div></div>
</main>

<script src="quiz.js"></script>
<script>
(() => {
  const IMGS = 8;
  const EFFECTS = ['zoom','slide','flip','rise','wipe','spin','rise','fade','slide']; // efecto de entrada por diapositiva
  const deck = document.getElementById('deck');
  const bg = document.getElementById('bg');
  const slides = [], bgs = [];
  let GAME = -1, quiz;
  let cur = 0, started = false, busy = false, timer = null, autoOn = false;

  // construir diapositivas
  for (let i = 1; i <= IMGS; i++) {
    if (i === IMGS) { // minijuego antes de la diapositiva final
      const g = document.createElement('div');
      g.className = 'slide';
      deck.appendChild(g);
      GAME = slides.length; slides.push(g); bgs.push('img/fondo.webp');
      quiz = Quiz.create(g, { onBack: () => go(GAME - 1, 'back'), onFinish: () => go(GAME + 1, 'fwd'), onWin: () => confetti() });
    }
    const s = document.createElement('div');
    s.className = 'slide';
    const img = document.createElement('img');
    img.src = `img/${i}.webp`;
    img.alt = `Diapositiva ${i}`;
    img.draggable = false;
    if (i > 2) img.loading = 'lazy';
    s.appendChild(img);
    deck.appendChild(s);
    slides.push(s); bgs.push(`img/${i}.webp`);
  }
  const TOTAL = slides.length;
  // botón JUGAR sobre la portada
  const play = document.createElement('button');
  play.id = 'play'; play.setAttribute('aria-label', 'Jugar: iniciar la presentación');
  slides[0].appendChild(play);

  // gif sorpresa en la última diapositiva
  const gato = document.createElement('img');
  gato.id = 'gato'; gato.alt = ''; gato.decoding = 'async';
  slides[TOTAL - 1].appendChild(gato);
  const showGato = () => { if (!gato.src) gato.src = 'img/gato.webp'; gato.classList.add('show'); };

  // confeti
  const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
  let parts = [], raf = 0, until = 0;
  const COLORS = ['#ff4d4d', '#ffd23f', '#3ddc84', '#4cc3ff', '#2f5bff', '#b36bff', '#ff7ac8', '#ff9f1c'];
  function fitCanvas() { const r = cv.getBoundingClientRect(); const d = Math.min(devicePixelRatio || 1, 2); cv.width = (cv.offsetWidth || 1) * d; cv.height = (cv.offsetHeight || 1) * d; cv._d = d; }
  function burst(x, y, n, spread) {
    const W = cv.width;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * spread, v = (6 + Math.random() * 11) * cv._d * W / 1500;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .22 * cv._d * W / 1500, w: (6 + Math.random() * 8) * cv._d * W / 1500, h: (4 + Math.random() * 6) * cv._d * W / 1500,
        r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, c: COLORS[i % COLORS.length], life: 0 });
    }
  }
  function tick(t) {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < cv.height + 40 && p.life < 360);
    for (const p of parts) {
      p.vy += p.g; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.min(1, (360 - p.life) / 60);
      cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    }
    if (parts.length || t < until) raf = requestAnimationFrame(tick); else { raf = 0; cx.clearRect(0, 0, cv.width, cv.height); }
  }
  function confetti() {
    fitCanvas(); const W = cv.width, H = cv.height;
    until = performance.now() + 3200;
    const waves = [[.15, 1.05], [.85, 1.05], [.5, 1.1], [.3, 1.05], [.7, 1.05], [.5, 1.1]];
    waves.forEach((w, i) => setTimeout(() => { if (cur === TOTAL - 1 || cur === GAME) burst(W * w[0], H * w[1], 70, 1.3); }, 900 + i * 450));
    if (!raf) raf = requestAnimationFrame(tick);
  }

  slides[0].classList.add('active');
  bg.style.backgroundImage = 'url(img/1.webp)';
  // precargar el resto
  for (let i = 2; i <= IMGS; i++) { const p = new Image(); p.src = `img/${i}.webp`; }

  function ui() {
    bg.style.backgroundImage = `url(${bgs[cur]})`;
  }

  function go(n, dir) {
    if (busy || n === cur || n < 0 || n >= TOTAL) return;
    dir = dir || (n > cur ? 'fwd' : 'back');
    const out = slides[cur], inn = slides[n];
    const fx = EFFECTS[dir === 'fwd' ? n : cur];
    busy = true;
    deck.className = `fx-${fx} ${dir}`;
    out.classList.remove('active'); out.classList.add('leaving', 'out');
    inn.classList.add('active', 'in');
    // reiniciar animación kenburns
    const im = inn.querySelector(':scope > img'); if (im) { im.classList.remove('kb'); void im.offsetWidth; im.classList.add('kb'); }
    cur = n; ui();
    if (cur >= TOTAL - 3 && !gato.src) gato.src = 'img/gato.webp';
    if (cur === GAME) { stopAuto(); quiz.reset(); } else quiz.stop();
    if (cur === TOTAL - 1) { showGato(); confetti(); }
    setTimeout(() => {
      out.classList.remove('leaving', 'out');
      inn.classList.remove('in');
      busy = false;
    }, 1000);
    if (autoOn && cur !== GAME) schedule();
  }
  const next = () => cur < TOTAL - 1 ? go(cur + 1, 'fwd') : (stopAuto(), go(0, 'back'));
  const prev = () => go(cur - 1, 'back');

  function start() {
    if (started) return;
    started = true; busy = true;
    document.body.classList.add('playing');
    enterFull();
    const loader = document.getElementById('loader'), tip = document.getElementById('tip');
    const tips = ['Conectando…', 'Uniéndose al servidor', 'Cargando recursos…'];
    let t = 0, done = false;
    tip.textContent = tips[0];
    loader.classList.add('on');
    const iv = setInterval(() => { tip.textContent = tips[Math.min(++t, tips.length - 1)]; }, 750);
    const finish = () => {
      if (done) return; done = true;
      clearInterval(iv); clearTimeout(to);
      loader.classList.remove('on');
      busy = false;
      setTimeout(() => go(1, 'fwd'), 250);
    };
    const to = setTimeout(finish, 2400);
    document.getElementById('skip').onclick = e => { e.stopPropagation(); finish(); };
  }
  play.onclick = e => { e.stopPropagation(); start(); };

  // auto
  function schedule() { clearTimeout(timer); timer = setTimeout(() => { if (cur === TOTAL - 1) stopAuto(); else next(); }, 5000); }
  function stopAuto() { autoOn = false; clearTimeout(timer); }
  function toggleAuto() {
    if (autoOn) return stopAuto();
    autoOn = true; schedule();
  }

  // Pantalla completa: API nativa si existe (escritorio/Android); en iPhone se gira la presentación para llenar la pantalla
  const root = document.documentElement;
  const reqFS = root.requestFullscreen || root.webkitRequestFullscreen;
  const inFS = () => document.fullscreenElement || document.webkitFullscreenElement;
  function enterFull() {
    if (reqFS) { try { const p = reqFS.call(root); p && p.catch && p.catch(() => document.body.classList.add('rot')); } catch (e) { document.body.classList.add('rot'); } }
    else document.body.classList.add('rot');
    document.body.classList.add('rot'); // en vertical gira; en horizontal no hace nada
  }
  function exitFull() {
    document.body.classList.remove('rot');
    if (inFS()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
  function fs() { (inFS() || document.body.classList.contains('rot')) ? exitFull() : enterFull(); }

  // teclado
  addEventListener('keydown', e => {
    if (!started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } return; }
    const k = e.key;
    if (cur === GAME) { if (quiz.key(k)) e.preventDefault(); return; }
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); stopAuto(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { stopAuto(); prev(); }
    else if (k === 'Home') { stopAuto(); go(0, 'back'); }
    else if (k === 'End') { stopAuto(); go(TOTAL - 1, 'fwd'); }
    else if (k === 'f' || k === 'F') fs();
    else if (k === 'p' || k === 'P') toggleAuto();
  });
  // clic en la diapositiva = siguiente (mitad izquierda = anterior)
  deck.addEventListener('click', e => {
    if (!started || cur === GAME) return;
    const r = deck.getBoundingClientRect();
    const rotated = document.body.classList.contains('rot') && matchMedia('(orientation:portrait)').matches;
    const frac = rotated ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
    stopAuto();
    frac < 0.25 ? prev() : next();
  });
  // swipe táctil
  let sx = 0, sy = 0;
  addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    if (!started || cur === GAME) return;
    let dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (document.body.classList.contains('rot') && matchMedia('(orientation:portrait)').matches) [dx, dy] = [dy, -dx];
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { stopAuto(); dx < 0 ? next() : prev(); }
  }, { passive: true });
  ui();
})();
</script>
</body>
</html>
