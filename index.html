<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recursos Visuales y Gráficos – EQUIPO5</title>
<meta name="description" content="Presentación interactiva: Recursos Visuales y Gráficos para apoyar a la comunidad.">
<meta property="og:title" content="Recursos Visuales y Gráficos – EQUIPO5">
<meta property="og:image" content="img/1.webp">
<style>
:root{--blue:#2f5bff;--ink:#0b1020}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.55) saturate(1.3);transform:scale(1.15);transition:background-image .6s}
#stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1600px}
#deck{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;overflow:hidden;background:#000;box-shadow:0 20px 80px rgba(0,0,0,.6);border-radius:clamp(0px,1vw,14px)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;will-change:transform,opacity}
.slide img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
.slide.active{opacity:1;visibility:visible;z-index:2}
.slide.leaving{visibility:visible;z-index:1}

/* --- transiciones de entrada / salida --- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}
@keyframes zoomOut{to{opacity:0;transform:scale(.8)}}
@keyframes slideInR{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideOutL{to{transform:translateX(-35%);opacity:.3}}
@keyframes slideInL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes slideOutR{to{transform:translateX(35%);opacity:.3}}
@keyframes flipIn{from{opacity:0;transform:rotateY(-90deg)}to{opacity:1;transform:none}}
@keyframes flipOut{to{opacity:0;transform:rotateY(90deg)}}
@keyframes riseIn{from{opacity:0;transform:translateY(60%) scale(.9)}to{opacity:1;transform:none}}
@keyframes sinkOut{to{opacity:0;transform:translateY(-30%) scale(1.05)}}
@keyframes spinIn{from{opacity:0;transform:rotate(-8deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes spinOut{to{opacity:0;transform:rotate(8deg) scale(1.3)}}
@keyframes wipeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blurOut{to{opacity:0;filter:blur(18px)}}

.fx-fade .in{animation:fadeIn .8s both}.fx-fade .out{animation:fadeOut .8s both}
.fx-zoom .in{animation:zoomIn .9s cubic-bezier(.2,.8,.2,1) both}.fx-zoom .out{animation:zoomOut .9s both}
.fx-slide.fwd .in{animation:slideInR .8s cubic-bezier(.7,0,.2,1) both}.fx-slide.fwd .out{animation:slideOutL .8s cubic-bezier(.7,0,.2,1) both}
.fx-slide.back .in{animation:slideInL .8s cubic-bezier(.7,0,.2,1) both}.fx-slide.back .out{animation:slideOutR .8s cubic-bezier(.7,0,.2,1) both}
.fx-flip .in{animation:flipIn .9s .25s both}.fx-flip .out{animation:flipOut .5s both}
.fx-rise .in{animation:riseIn .9s cubic-bezier(.2,.9,.3,1) both}.fx-rise .out{animation:sinkOut .9s both}
.fx-spin .in{animation:spinIn .9s cubic-bezier(.2,.9,.3,1) both}.fx-spin .out{animation:spinOut .9s both}
.fx-wipe .in{animation:wipeIn .9s cubic-bezier(.7,0,.2,1) both}.fx-wipe .out{animation:blurOut .9s both}
.slide.active .kb{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.035)}}

/* --- botón JUGAR sobre la portada --- */
#play{position:absolute;left:23.8%;top:82.6%;width:51%;height:14.2%;border:0;border-radius:1.6vw;background:transparent;cursor:pointer;z-index:5;
  animation:pulse 1.8s ease-in-out infinite;transition:background .2s,transform .15s}
#play:hover{background:rgba(255,255,255,.14);transform:scale(1.015)}
#play:active{transform:scale(.98)}
#play:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,91,255,.7)}60%{box-shadow:0 0 0 1.6vw rgba(47,91,255,0)}}
#hint{position:absolute;left:0;right:0;bottom:1.2%;text-align:center;font-size:clamp(11px,1.4vw,18px);color:#4a5578;z-index:5;pointer-events:none;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
body.playing #play,body.playing #hint{display:none}

/* --- controles --- */
.nav{position:fixed;top:50%;translate:0 -50%;z-index:10;width:52px;height:52px;border-radius:50%;border:0;background:rgba(10,15,35,.55);backdrop-filter:blur(8px);color:#fff;font-size:24px;cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s,background .2s,scale .15s}
.nav:hover{background:var(--blue);scale:1.1}
#prev{left:14px}#next{right:14px}
body.playing .nav{opacity:.85;pointer-events:auto}
body.playing.idle .nav,body.playing.idle #bar{opacity:0}
#bar{position:fixed;left:50%;bottom:16px;translate:-50% 0;z-index:10;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:rgba(10,15,35,.6);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s}
body.playing #bar{opacity:1;pointer-events:auto}
.dot{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer;transition:all .25s}
.dot:hover{background:rgba(255,255,255,.7)}
.dot.on{width:28px;border-radius:6px;background:var(--blue)}
.tool{border:0;background:none;color:#fff;font-size:18px;cursor:pointer;padding:2px 6px;border-radius:8px}
.tool:hover{background:rgba(255,255,255,.15)}
#count{font-size:13px;opacity:.8;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
#progress{position:fixed;left:0;top:0;height:4px;background:linear-gradient(90deg,#4cc3ff,var(--blue));z-index:11;width:0;transition:width .6s cubic-bezier(.7,0,.2,1)}
@media (max-width:600px){.nav{width:42px;height:42px;font-size:20px}#bar{gap:6px;padding:6px 10px}.dot{width:8px;height:8px}.dot.on{width:20px}}
@media (prefers-reduced-motion:reduce){.slide *,.slide{animation-duration:.01s!important}#play{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="progress"></div>

<main id="stage">
  <div id="deck" aria-live="polite"></div>
</main>

<button class="nav" id="prev" aria-label="Anterior">&#10094;</button>
<button class="nav" id="next" aria-label="Siguiente">&#10095;</button>

<div id="bar">
  <button class="tool" id="auto" title="Reproducción automática (P)" aria-label="Reproducción automática">&#9654;</button>
  <div id="dots" style="display:flex;gap:8px;align-items:center"></div>
  <span id="count">1 / 8</span>
  <button class="tool" id="fs" title="Pantalla completa (F)" aria-label="Pantalla completa">&#9974;</button>
</div>

<script>
(() => {
  const TOTAL = 8;
  const EFFECTS = ['zoom','slide','flip','rise','wipe','spin','fade','slide']; // efecto de entrada por diapositiva
  const deck = document.getElementById('deck');
  const dots = document.getElementById('dots');
  const bg = document.getElementById('bg');
  const slides = [], dotEls = [];
  let cur = 0, started = false, busy = false, timer = null, autoOn = false, idleT;

  // construir diapositivas
  for (let i = 1; i <= TOTAL; i++) {
    const s = document.createElement('div');
    s.className = 'slide';
    const img = document.createElement('img');
    img.src = `img/${i}.webp`;
    img.alt = `Diapositiva ${i}`;
    img.draggable = false;
    if (i > 2) img.loading = 'lazy';
    s.appendChild(img);
    deck.appendChild(s);
    slides.push(s);
    const d = document.createElement('button');
    d.className = 'dot'; d.setAttribute('aria-label', `Ir a la diapositiva ${i}`);
    d.onclick = () => { stopAuto(); go(i - 1); };
    dots.appendChild(d); dotEls.push(d);
  }
  // botón JUGAR sobre la portada
  const play = document.createElement('button');
  play.id = 'play'; play.setAttribute('aria-label', 'Jugar: iniciar la presentación');
  slides[0].appendChild(play);
  const hint = document.createElement('div');
  hint.id = 'hint'; hint.textContent = 'Toca ▶ para empezar la presentación';
  slides[0].appendChild(hint);

  slides[0].classList.add('active');
  bg.style.backgroundImage = 'url(img/1.webp)';
  // precargar el resto
  for (let i = 2; i <= TOTAL; i++) { const p = new Image(); p.src = `img/${i}.webp`; }

  function ui() {
    dotEls.forEach((d, i) => d.classList.toggle('on', i === cur));
    document.getElementById('count').textContent = `${cur + 1} / ${TOTAL}`;
    document.getElementById('progress').style.width = ((cur + 1) / TOTAL * 100) + '%';
    bg.style.backgroundImage = `url(img/${cur + 1}.webp)`;
  }

  function go(n, dir) {
    if (busy || n === cur || n < 0 || n >= TOTAL) return;
    dir = dir || (n > cur ? 'fwd' : 'back');
    const out = slides[cur], inn = slides[n];
    const fx = EFFECTS[dir === 'fwd' ? n : cur];
    busy = true;
    deck.className = `fx-${fx} ${dir}`;
    out.classList.remove('active'); out.classList.add('leaving', 'out');
    inn.classList.add('active', 'in');
    // reiniciar animación kenburns
    const im = inn.querySelector('img'); im.classList.remove('kb'); void im.offsetWidth; im.classList.add('kb');
    cur = n; ui();
    setTimeout(() => {
      out.classList.remove('leaving', 'out');
      inn.classList.remove('in');
      busy = false;
    }, 1000);
    if (autoOn) schedule();
  }
  const next = () => cur < TOTAL - 1 ? go(cur + 1, 'fwd') : (stopAuto(), go(0, 'back'));
  const prev = () => go(cur - 1, 'back');

  function start() {
    if (started) return;
    started = true;
    document.body.classList.add('playing');
    // pantalla completa si el navegador lo permite (sin romper si falla)
    try { const r = document.documentElement.requestFullscreen; if (r && matchMedia('(pointer:fine)').matches) r.call(document.documentElement).catch(() => {}); } catch (e) {}
    go(1, 'fwd');
    wake();
  }
  play.onclick = e => { e.stopPropagation(); start(); };

  // auto
  function schedule() { clearTimeout(timer); timer = setTimeout(() => { if (cur === TOTAL - 1) stopAuto(); else next(); }, 5000); }
  function stopAuto() { autoOn = false; clearTimeout(timer); document.getElementById('auto').innerHTML = '&#9654;'; }
  function toggleAuto() {
    if (autoOn) return stopAuto();
    autoOn = true; document.getElementById('auto').innerHTML = '&#10074;&#10074;'; schedule();
  }
  document.getElementById('auto').onclick = toggleAuto;

  function fs() {
    if (document.fullscreenElement) document.exitFullscreen();
    else (document.documentElement.requestFullscreen || (() => {})).call(document.documentElement);
  }
  document.getElementById('fs').onclick = fs;
  document.getElementById('next').onclick = () => { stopAuto(); next(); };
  document.getElementById('prev').onclick = () => { stopAuto(); prev(); };

  // teclado
  addEventListener('keydown', e => {
    if (!started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } return; }
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); stopAuto(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { stopAuto(); prev(); }
    else if (k === 'Home') { stopAuto(); go(0, 'back'); }
    else if (k === 'End') { stopAuto(); go(TOTAL - 1, 'fwd'); }
    else if (k === 'f' || k === 'F') fs();
    else if (k === 'p' || k === 'P') toggleAuto();
  });
  // clic en la diapositiva = siguiente (mitad izquierda = anterior)
  deck.addEventListener('click', e => {
    if (!started) return;
    const r = deck.getBoundingClientRect();
    stopAuto();
    (e.clientX - r.left) < r.width * 0.25 ? prev() : next();
  });
  // swipe táctil
  let sx = 0, sy = 0;
  addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    if (!started) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { stopAuto(); dx < 0 ? next() : prev(); }
  }, { passive: true });
  // ocultar controles al estar inactivo
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => started && document.body.classList.add('idle'), 3000); }
  ['mousemove', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  ui();
})();
</script>
</body>
</html>
